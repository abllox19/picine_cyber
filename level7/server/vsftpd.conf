listen=YES
listen_ipv6=NO
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES

# Pointer sur le fichier PAM créé (/etc/pam.d/vsftpd)
pam_service_name=vsftpd

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

seccomp_sandbox=NO